name: Verify Java solutions

on:
  push:
    paths:
      - "content/alt.txt"
      - "scripts/verify_java.py"
      - ".github/workflows/verify.yml"
  workflow_dispatch:

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Download JUnit console launcher
        run: curl -sSfL -o junit.jar https://repo1.maven.org/maven2/org/junit/platform/junit-platform-console-standalone/1.10.2/junit-platform-console-standalone-1.10.2.jar
      - name: Compile and test code cards
        run: python3 scripts/verify_java.py . "$PWD/junit.jar"
